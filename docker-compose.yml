services:
  postgres:
    image: postgres:16-alpine
    container_name: tcit-posts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tcit_posts}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tcit_posts_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tcit_posts}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tcit_posts_pgdata:
